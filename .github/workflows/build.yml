name: Build VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release step attaches the installer to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version and toolchain
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(SunoChain VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          if (-not $ver) { throw "version not found in CMakeLists.txt" }
          echo "SC_VERSION=$ver" >> $env:GITHUB_ENV
          echo "Suno Chain $ver"
          cmake --version
          python --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion

      - name: Configure
        # no fixed -G: use whatever Visual Studio the runner image has. The configure log prints the plugin version,
        # the JUCE tag and the compiler (see CMakeLists.txt).
        run: cmake -B build -A x64 -DSUNOCHAIN_TESTS=ON

      - name: Build (plugin, test app, render_cli)
        run: cmake --build build --config Release -- /clp:ErrorsOnly

      - name: Check the VST3 bundle
        shell: pwsh
        run: |
          $bundle = "build/SunoChain_artefacts/Release/VST3/Suno Chain.vst3"
          $dll = Join-Path $bundle "Contents/x86_64-win/Suno Chain.vst3"
          if (-not (Test-Path $bundle -PathType Container)) { throw "VST3 bundle missing: $bundle" }
          if (-not (Test-Path $dll -PathType Leaf)) { throw "VST3 binary missing: $dll" }
          if ((Get-Item $dll).Length -lt 500000) { throw "VST3 binary is suspiciously small" }
          Get-ChildItem -Recurse $bundle | Select-Object FullName, Length | Format-Table -AutoSize
          echo "VST3_PATH=$((Resolve-Path $bundle).Path)" >> $env:GITHUB_ENV

      - name: Build the Windows installer
        shell: pwsh
        run: |
          # errors are also written as annotations (::error::), readable from the run summary / API
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $c = choco install innosetup -y --no-progress 2>&1; if (-not (Test-Path $iscc)) { $c | Select-Object -Last 15 | ForEach-Object { echo "::error::choco: $_" } } }
          if (-not (Test-Path $iscc)) {
            $found = Get-ChildItem -Recurse "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $iscc = $found.FullName } else { echo "::error::Inno Setup (ISCC.exe) not found"; exit 1 }
          }
          $out = Join-Path $PWD "build\installer"
          $log = & $iscc "/DAppVersion=$env:SC_VERSION" "/DBundleDir=$env:VST3_PATH" "/DOutDir=$out" installer\SunoChain.iss 2>&1
          $code = $LASTEXITCODE
          $log | ForEach-Object { echo $_ }
          if ($code -ne 0) {
            # GitHub keeps only 10 annotations per step: the error lines first, then the very end of the log
            $err = @($log | Where-Object { "$_" -match 'rror|Line \d+|Column|Unknown|Invalid|not found' }) + @($log | Select-Object -Last 3)
            $err | Select-Object -First 9 | ForEach-Object { echo "::error::ISCC: $_" }
            exit 1
          }
          $setup = Join-Path $out "SunoChain_Setup_v$env:SC_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "installer not created" }
          echo "SETUP_PATH=$setup" >> $env:GITHUB_ENV

      # plugin and installer are uploaded first, so they can be downloaded even if a test below fails (run = red)
      - uses: actions/upload-artifact@v4
        with:
          name: SunoChain-VST3
          path: ${{ env.VST3_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: SunoChain-Setup
          path: ${{ env.SETUP_PATH }}

      - name: Factory presets header is up to date
        run: python tools/gen_factory_presets.py --check

      - name: Tests (real processor, all presets, sessions, realtime, latency)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter "SunoChainTests.exe" | Select-Object -First 1
          if (-not $exe) { throw "SunoChainTests.exe not built" }
          # golden metrics were made on Linux/GCC: 1 dB tolerance across compilers (bit-exact on the same compiler)
          & $exe.FullName --presets-dir presets --golden tests/golden/golden.txt --tol 1.0 --state-blob tests/data/session_v2_0.bin 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { throw "SunoChainTests failed (exit $LASTEXITCODE)" }

      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = Get-ChildItem -Recurse pluginval -Filter "pluginval.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          & $pv.FullName --strictness-level 5 --validate-in-process --timeout-ms 900000 --output-dir pluginval-logs --validate "$env:VST3_PATH" 2>&1 | Tee-Object -FilePath pluginval.log
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed (exit $LASTEXITCODE)" }

      # only a green build on main becomes a release: the installer is then one click away on the Releases page
      - name: Publish release (installer)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:SC_VERSION"
          $notes = "Suno Chain $env:SC_VERSION`n`nInstall: download SunoChain_Setup_v$env:SC_VERSION.exe below, close Cubase, run it. It replaces the plugin in C:\Program Files\Common Files\VST3. Your presets are not touched.`n`nWhat changed: see README.md."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$env:SETUP_PATH" --clobber
          } else {
            gh release create $tag "$env:SETUP_PATH" --target $env:GITHUB_SHA --title "Suno Chain $env:SC_VERSION" --notes $notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "release failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunoChain-test-logs
          path: |
            tests.log
            pluginval.log
            pluginval-logs
          if-no-files-found: ignore
