name: Build VST3

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          python --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property displayName
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion

      - name: Configure
        # no fixed -G: use whatever Visual Studio the runner image has. The configure log prints the plugin version,
        # the JUCE tag and the compiler (see CMakeLists.txt).
        run: cmake -B build -A x64 -DSUNOCHAIN_TESTS=ON

      - name: Build (plugin, test app, render_cli)
        run: cmake --build build --config Release -- /clp:ErrorsOnly

      - name: Check the VST3 bundle
        shell: pwsh
        run: |
          $bundle = "build/SunoChain_artefacts/Release/VST3/Suno Chain.vst3"
          $dll = Join-Path $bundle "Contents/x86_64-win/Suno Chain.vst3"
          if (-not (Test-Path $bundle -PathType Container)) { throw "VST3 bundle missing: $bundle" }
          if (-not (Test-Path $dll -PathType Leaf)) { throw "VST3 binary missing: $dll" }
          if ((Get-Item $dll).Length -lt 500000) { throw "VST3 binary is suspiciously small" }
          Get-ChildItem -Recurse $bundle | Select-Object FullName, Length | Format-Table -AutoSize
          echo "VST3_PATH=$((Resolve-Path $bundle).Path)" >> $env:GITHUB_ENV

      # the plugin is uploaded first, so it can be downloaded even if a test below fails (the run is then red)
      - uses: actions/upload-artifact@v4
        with:
          name: SunoChain-VST3
          path: ${{ env.VST3_PATH }}

      - name: Factory presets header is up to date
        run: python tools/gen_factory_presets.py --check

      - name: Tests (real processor, all presets, sessions, realtime, latency)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build -Filter "SunoChainTests.exe" | Select-Object -First 1
          if (-not $exe) { throw "SunoChainTests.exe not built" }
          # golden metrics were made on Linux/GCC: 1 dB tolerance across compilers (bit-exact on the same compiler)
          & $exe.FullName --presets-dir presets --golden tests/golden/golden.txt --tol 1.0 --state-blob tests/data/session_v2_0.bin 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) { throw "SunoChainTests failed (exit $LASTEXITCODE)" }

      - name: pluginval (strictness 5)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $pv = Get-ChildItem -Recurse pluginval -Filter "pluginval.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force pluginval-logs | Out-Null
          & $pv.FullName --strictness-level 5 --validate-in-process --timeout-ms 900000 --output-dir pluginval-logs --validate "$env:VST3_PATH" 2>&1 | Tee-Object -FilePath pluginval.log
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed (exit $LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SunoChain-test-logs
          path: |
            tests.log
            pluginval.log
            pluginval-logs
          if-no-files-found: ignore
